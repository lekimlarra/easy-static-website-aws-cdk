name: Authenticate against AWS
description: >-
  Uses GitHub's OIDC provider when AWS_ROLE_ARN is available (recommended: no
  long lived key is stored in the repository) and falls back to access keys.

inputs:
  aws-region:
    description: Region the AWS CLI and the CDK will target.
    required: true
  role-to-assume:
    description: ARN of the IAM role to assume through OIDC (secret AWS_ROLE_ARN).
    required: false
    default: ""
  access-key-id:
    description: Fallback access key id (secret AWS_ACCESS_KEY_ID).
    required: false
    default: ""
  secret-access-key:
    description: Fallback secret access key (secret AWS_SECRET_ACCESS_KEY).
    required: false
    default: ""

runs:
  using: composite
  steps:
    - name: Check that some credentials were provided
      shell: bash
      run: |
        if [ -z "${{ inputs.role-to-assume }}" ] && [ -z "${{ inputs.access-key-id }}" ]; then
          echo "::error::No AWS credentials configured. Add the AWS_ROLE_ARN secret (OIDC) or the AWS_ACCESS_KEY_ID / AWS_SECRET_ACCESS_KEY pair."
          exit 1
        fi
        if [ -z "${{ inputs.aws-region }}" ]; then
          echo "::error::No region available. Add \"awsRegion=<region>\" to the APP_CONFIG repository variable."
          exit 1
        fi

    - name: Assume the deployment role (OIDC)
      if: inputs.role-to-assume != ''
      uses: aws-actions/configure-aws-credentials@v4
      with:
        role-to-assume: ${{ inputs.role-to-assume }}
        role-session-name: github-actions-${{ github.run_id }}
        aws-region: ${{ inputs.aws-region }}

    - name: Configure static credentials
      if: inputs.role-to-assume == ''
      uses: aws-actions/configure-aws-credentials@v4
      with:
        aws-access-key-id: ${{ inputs.access-key-id }}
        aws-secret-access-key: ${{ inputs.secret-access-key }}
        aws-region: ${{ inputs.aws-region }}

    - name: Show the identity in use
      shell: bash
      run: aws sts get-caller-identity --query Arn --output text
